<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZIMI SHOP</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="splash-orb"></div><div class="welcome">Welcome to <b>AZIMI SHOP</b></div><div class="splash-line"></div></div>
<header class="topbar"><div class="logo"><span>AZ</span><div><b>AZIMI</b><small>SHOP</small></div></div>
<div class="top-actions"><button id="themeBtn">☀️</button><button onclick="showPage('cart')">🛒 <i id="cartCount">0</i></button></div></header>
<aside class="sidebar"><div class="side-label">AZIMI / MENU</div>
<button class="active" onclick="showPage('home')">⌂ <span>خانه</span></button>
<button onclick="showPage('store')">🛍️ <span>فروشگاه</span></button>
<button onclick="showPage('discounts')">🔥 <span>لوازم تخفیفی</span></button>
<button onclick="showPage('services')">◈ <span>ساخت و طراحی سایت و اپلیکیشن</span></button>
<button onclick="showPage('invoice')">🧾 <span>صورت حساب</span></button>
<button onclick="showPage('bonus')">🎁 <span>بونوس هفتگی</span></button>
<button onclick="showPage('shipping')">🚚 <span>ارسالی به ۳۴ ولایت</span></button>
<div class="side-bottom">AZIMI SHOP<br><small>Premium digital market</small></div></aside>
<main id="app"></main>
<div id="toast"></div>
<script src="app.js"></script>
<script>
(function(){
  // Owner-only hidden admin shortcut: press Ctrl+A, then Z. No password.
  let adminSequence=false;
  let adminTimer=null;
  document.addEventListener('keydown', function(e){
    const key=(e.key||'').toLowerCase();
    if(e.ctrlKey && key==='a'){
      e.preventDefault();
      adminSequence=true;
      clearTimeout(adminTimer);
      adminTimer=setTimeout(()=>adminSequence=false, 1500);
      return;
    }
    if(adminSequence && key==='z'){
      e.preventDefault();
      adminSequence=false;
      clearTimeout(adminTimer);
      if(typeof adminLogin==='function') adminLogin();
    }
  });
})();
</script>
</body></html>
